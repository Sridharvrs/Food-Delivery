<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FoodRush | Page Not Found</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Common CSS -->
  <link rel="stylesheet" href="css/common.css">

  <!-- Error CSS -->
  <link rel="stylesheet" href="css/error.css">
</head>

<body class="pg-error">

  <main class="error-page">

    <!-- Background Decorations -->
    <div class="error-shape shape-one"></div>
    <div class="error-shape shape-two"></div>
    <div class="error-shape shape-three"></div>

    <div class="error-wrap">

      <!-- Logo -->
      <a href="index.html" class="error-logo">
        <img src="images/logo.png" alt="FoodRush">
      </a>

      <!-- Food Illustration -->
      <div class="error-food">

        <div class="food-circle">
          <span class="food-main">🍔</span>
        </div>

        <span class="floating-food food-one">🍕</span>
        <span class="floating-food food-two">🍟</span>
        <span class="floating-food food-three">🥤</span>

      </div>

      <!-- Error Number -->
      <div class="error-number">
        4<span>0</span>4
      </div>

      <!-- Content -->
      <div class="error-content">

        <span class="error-label">
          <i class="fa-solid fa-triangle-exclamation"></i>
          Oops! Wrong turn
        </span>

        <h1>
          This page is
          <span>off the menu.</span>
        </h1>

        <p>
          Looks like this page has disappeared faster than
          our fries. Don't worry — there's plenty of good
          stuff waiting for you back at FoodRush.
        </p>

        <!-- Actions -->
        <div class="error-actions">

          <a href="index.html" class="error-btn primary">
            <i class="fa-solid fa-house"></i>
            Back to Home
          </a>

          <a href="menu.html" class="error-btn secondary">
            <i class="fa-solid fa-utensils"></i>
            Explore Menu
          </a>

        </div>

      </div>

      <!-- Bottom Message -->
      <div class="error-bottom">

        <span>
          <i class="fa-solid fa-burger"></i>
          Fresh food is just a click away
        </span>

        <span>
          <i class="fa-solid fa-truck-fast"></i>
          Fast delivery
        </span>

        <span>
          <i class="fa-solid fa-star"></i>
          4.8 rated
        </span>

      </div>

    </div>

  </main>

</body>
</html>
